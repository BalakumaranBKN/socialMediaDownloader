<header class="navbar glass-panel">
  <div class="nav-container">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-emblem">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" class="bkn-logo-svg">
          <defs>
            <linearGradient id="bknGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#06b6d4" />
              <stop offset="50%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
            <linearGradient id="bknStroke" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#67e8f9" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#bknGrad)" fill-opacity="0.18" stroke="url(#bknStroke)" stroke-width="1.5" />
          <path d="M12 28V16H17.8C20 16 21.4 17 21.4 18.8C21.4 20 20.6 20.9 19.4 21.3C20.9 21.7 21.8 22.8 21.8 24.5C21.8 26.6 20.2 28 17.8 28H12ZM14.8 21.2H17.6C18.6 21.2 19.2 20.6 19.2 19.8C19.2 18.9 18.6 18.3 17.6 18.3H14.8V21.2ZM14.8 25.7H17.8C18.9 25.7 19.6 25.1 19.6 24.1C19.6 23.2 18.9 22.6 17.8 22.6H14.8V25.7Z" fill="#f8fafc" />
          <path d="M22.5 28V16H25V21.2L28.8 16H31.8L27.2 22.1L32.2 28H29L25 23.2V28H22.5Z" fill="#67e8f9" />
        </svg>
        <span class="pulse-dot"></span>
      </div>
      <div class="brand-text">
        <div class="brand-title-wrap">
          <span class="brand-name">BKN</span>
          <span class="engine-badge">CORE V2</span>
        </div>
        <span class="brand-sub">Social Platform Downloader</span>
      </div>
    </div>

    <!-- Platforms list pills -->
    <div class="platforms-chips">
      @for (p of platforms(); track p.id) {
        <div 
          class="platform-pill" 
          [style.--pill-color]="p.badge_color"
          [title]="'Supports ' + p.supported_types.join(', ')">
          <i class="pi" [ngClass]="p.icon"></i>
          <span>{{ p.name }}</span>
        </div>
      }
    </div>

    <!-- Actions -->
    <div class="nav-actions">
      <div class="status-indicator" title="Media extraction engine is active">
        <span class="status-dot"></span>
        <span class="status-label">Engine Ready</span>
      </div>

      <p-button 
        icon="pi pi-history" 
        label="History" 
        [rounded]="true" 
        severity="secondary" 
        [outlined]="true"
        [badge]="historyCount() > 0 ? historyCount().toString() : ''"
        badgeSeverity="danger"
        class="history-btn"
        (onClick)="toggleHistory.emit()">
      </p-button>
    </div>
  </div>
</header>
